[package]
name = "catalyst-code-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "OpenAI-compatible coding agent core with native Umans provider"

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
# rustls + webpki for public CAs; http2 for ALPN with Cloudflare/CDN gateways.
# default-features = false drops native-tls; we stay rustls-only for portable
# static builds (AppImage / musl-ish Linux distros without OpenSSL).
#
# native-roots + system-proxy are Linux/Windows-only (target cfg below): on
# macOS they pull Security/SystemConfiguration/CoreFoundation frameworks,
# which cargo-zigbuild cannot link when cross-compiling from Linux (no
# MacOSX.sdk on the runner). macOS still trusts public CAs via webpki-roots
# bundled with rustls-tls.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio-util = "0.7"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
bytes = "1"
# Embedded structural rewrite engine. Keep the parser set narrow so releases do
# not require a separately installed ast-grep executable or all grammars.
ast-grep-core = { version = "=0.44.0", default-features = false, features = ["tree-sitter"] }
ast-grep-language = { version = "=0.44.0", default-features = false, features = [
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-md",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# Sandbox: official Microsandbox Rust SDK (embeddable microVM). Gated behind
# the `microsandbox` feature (default on) so the SDK's heavy dep tree is only
# pulled when sandboxing is compiled in. ALL SDK types live behind CatCode-owned
# abstractions in `core/src/sandbox/` — never call the SDK directly from tools.
async-trait = "0.1"
thiserror = "1"
microsandbox = { version = "0.6.6", optional = true, default-features = false, features = ["net", "prebuilt"] }
wry = { version = "0.53", optional = true }
tao = { version = "0.34", optional = true }
# Linux screenshot: WebKitGTK get_snapshot → cairo PNG (versions aligned with wry 0.53).
webkit2gtk = { version = "2.0.1", optional = true }
cairo = { version = "0.18", package = "cairo-rs", optional = true, features = ["png"] }
gtk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gio = { version = "0.18", optional = true }

# Chromium DevTools Protocol transport. Kept optional so `--no-default-features`
# remains free of browser and native GUI dependencies.
tokio-tungstenite = { version = "0.24", optional = true }
# Corporate/WSL MITM CAs in /etc/ssl/certs (or the Windows cert store), plus
# HTTP(S)_PROXY / platform system-proxy. Not enabled for macOS — see note above.
[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "system-proxy"] }

[features]
default = ["microsandbox"]
chromium-cdp = ["dep:tokio-tungstenite"]
native-browser = ["dep:wry", "dep:tao", "dep:webkit2gtk", "dep:cairo", "dep:gio", "dep:gtk", "dep:glib"]
# Microsandbox microVM sandboxing (Linux/KVM, Apple Silicon macOS, Windows/WHP).
# The SDK downloads its own runtime (msb + libkrunfw) on first use; no external
# CLI/daemon is required. Disable to build a sandbox-less core.
microsandbox = ["dep:microsandbox"]

[dev-dependencies]
filetime = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
